services:
  postgres:
    image: postgres:17-alpine
    container_name: securecode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: securecode
      POSTGRES_USER: securecode
      POSTGRES_PASSWORD: securecode_dev_password
    ports:
      - '5433:5432'
    volumes:
      - securecode_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U securecode -d securecode']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securecode-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - securecode_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  securecode_postgres_data:
    name: securecode_postgres_data
  securecode_redis_data:
    name: securecode_redis_data
